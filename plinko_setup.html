<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko - Setup</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="number"], select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plinko Game Setup</h1>
        <div class="form-group">
            <label for="betAmount">Bet Amount:</label>
            <input type="number" id="betAmount" name="betAmount" value="1" min="0.1" step="0.1">
        </div>
        <div class="form-group">
            <label for="riskLevel">Risk Level:</label>
            <select id="riskLevel" name="riskLevel">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
        </div>
        <div class="form-group">
            <label for="pinRows">Number of Pin Rows:</label>
            <select id="pinRows" name="pinRows">
                <option value="8">8</option>
                <option value="10">10</option>
                <option value="12" selected>12</option>
                <option value="14">14</option>
                <option value="16">16</option>
            </select>
        </div>
        <button id="playButton">Play Game</button>
    </div>
    <script>
        const playButton = document.getElementById('playButton');
        const betAmountInput = document.getElementById('betAmount');
        const riskLevelSelect = document.getElementById('riskLevel');
        const pinRowsSelect = document.getElementById('pinRows');

        playButton.addEventListener('click', function() {
            const betAmount = betAmountInput.value;
            const riskLevel = riskLevelSelect.value;
            const pinRows = pinRowsSelect.value;

            // Validate inputs (basic validation)
            if (parseFloat(betAmount) <= 0) {
                alert('Bet amount must be greater than 0.');
                return;
            }
            if (!riskLevel) {
                alert('Please select a risk level.');
                return;
            }
            if (!pinRows) {
                alert('Please select the number of pin rows.');
                return;
            }

            localStorage.setItem('plinkoBetAmount', betAmount);
            localStorage.setItem('plinkoRiskLevel', riskLevel);
            localStorage.setItem('plinkoPinRows', pinRows);

            window.location.href = 'plinko_game.html';
        });
    </script>
</body>
</html>
