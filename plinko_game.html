<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko - Game</title>
    <link rel="stylesheet" href="css/style.css"> <!-- Link to the common stylesheet -->
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column; /* Changed to column for score and board */
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            padding-top: 20px; /* Add some padding at the top */
        }
        #infoDisplay {
            width: 80%;
            max-width: 600px; /* Max width for the info display */
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #infoDisplay div {
            text-align: center;
        }
        #gameCanvas {
            border: 1px solid #333;
            background-color: #fff; /* White background for the canvas */
            border-radius: 8px; /* Rounded corners for the canvas */
            box-shadow: 0 0 10px rgba(0,0,0,0.1); /* Subtle shadow */
        }
        .controls {
            margin-top: 20px;
        }
        button { 
            padding: 10px 20px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            margin: 0 10px;
        }
        button:hover { 
            background-color: #0056b3; 
        }
    </style>
</head>
<body>
    <div class="container"> <!-- Assuming this is the main game container -->
        <div id="lastPlaysContainer">
            <span class="last-plays-label">Recent:</span>
            <div id="lastPlaysDisplay">
                <!-- Last plays will be populated here -->
            </div>
        </div>
    <div id="infoDisplay">
        <div>Bet: <span id="betDisplay">-</span></div>
        <div>Risk: <span id="riskDisplay">-</span></div>
        <div>Rows: <span id="rowsDisplay">-</span></div>
        <div>Multiplier: <span id="multiplierDisplay">-</span></div>
        <div>Winnings: <span id="winningsDisplay">-</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <button id="dropBallButton">Drop Ball</button>
        <button id="settingsButton">Change Settings</button>
    </div>

    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const betDisplay = document.getElementById('betDisplay');
const riskDisplay = document.getElementById('riskDisplay');
const rowsDisplay = document.getElementById('rowsDisplay');
const multiplierDisplay = document.getElementById('multiplierDisplay');
const winningsDisplay = document.getElementById('winningsDisplay');

const dropBallButton = document.getElementById('dropBallButton');
const settingsButton = document.getElementById('settingsButton');

// --- Game Settings ---
let betAmount;
let riskLevel;
let numRows;

// --- Board Configuration ---
const PEG_RADIUS = 8;
// const PEG_COLOR = '#333'; // Removed for Style 2025
const PEG_SPACING_X = 50; 
const PEG_SPACING_Y = 40;
const BOARD_PADDING_X = 50; // Padding on the sides of the board
const TOP_OFFSET = 50; // Space above the first row of pegs for ball drop
const BOTTOM_SLOT_HEIGHT = 50;
const SLOT_WIDTH = PEG_SPACING_X; 
// const SLOT_COLOR_DEFAULT = '#888'; // Removed for Style 2025 - handled in drawBoard
// const SLOT_TEXT_COLOR = '#fff'; // Removed for Style 2025 - handled in drawBoard

const BALL_RADIUS = 7;
// const BALL_COLOR = 'red'; // Removed for Style 2025
const GRAVITY = 0.2; // Adjust for desired speed
const DAMPENING = 0.6; // Energy loss on bounce, less than 1
const HORIZONTAL_PUSH = 2; // How much horizontal push from a peg hit

let ball;
let animationFrameId; // To control the animation loop

let pegs = [];
let slots = [];

// --- Multipliers (Placeholders - to be refined based on risk) ---
// These are just examples. The number of slots depends on numRows + 1
const MULTIPLIERS = {
    low: { // Focus on lower payouts, many <1x, house edge more evident
        '8':  [5,  2,  1.5, 0.7, 0.4, 0.7, 1.5, 2,  5],
        '10': [7,  3,  1.2, 0.6, 0.3, 0.3, 0.6, 1.2, 3,  7],
        '12': [10, 4,  1.5, 0.7, 0.4, 0.2, 0.4, 0.7, 1.5, 4,  10],
        '14': [12, 5,  2,   0.8, 0.5, 0.3, 0.2, 0.3, 0.5, 0.8, 2,   5,  12],
        '16': [15, 6,  2.5, 1,   0.6, 0.4, 0.2, 0.1, 0.2, 0.4, 0.6, 1,   2.5, 6,  15]
    },
    medium: { // Mix of some wins, but average clearly < bet. Higher variance than low.
        '8':  [15, 5,  2,   0.8, 0.3, 0.8, 2,   5,  15],
        '10': [20, 7,  2.5, 1,   0.4, 0.2, 0.4, 1,   2.5, 7,  20],
        '12': [30, 10, 3,   1.2, 0.5, 0.1, 0.1, 0.5, 1.2, 3,   10, 30],
        '14': [50, 15, 4,   1.5, 0.6, 0.3, 0.1, 0.3, 0.6, 1.5, 4,   15, 50],
        '16': [70, 20, 5,   2,   0.8, 0.4, 0.2, 0.05,0.2, 0.4, 0.8, 2,   5,   20, 70]
    },
    high: { // Highest potential rewards but many very low outcomes. Highest variance.
        '8':  [40,  10, 3,   0.5, 0.1, 0.5, 3,   10, 40],
        '10': [100, 15, 4,   0.8, 0.2, 0.1, 0.2, 0.8, 4,   15, 100],
        '12': [200, 25, 5,   1,   0.4, 0.1, 0.05,0.1, 0.4, 1,   5,   25, 200],
        '14': [300, 50, 10,  2,   0.5, 0.2, 0.05,0.1,0.05,0.2, 0.5, 2,   10,  50, 300],
        '16': [500, 75, 15,  3,   0.8, 0.3, 0.1, 0.02,0.05,0.1,0.3, 0.8, 3,   15,  75, 500]
    }
};

function updateLastPlaysDisplay() {
    const displayElement = document.getElementById('lastPlaysDisplay');
    if (!displayElement) return;

    const history = JSON.parse(localStorage.getItem('plinkoPlayHistory')) || [];
    const recentPlays = history.slice(0, 5); // Get last 5 plays

    displayElement.innerHTML = ''; // Clear old items

    if (recentPlays.length === 0) {
        // Optionally, display a placeholder like "No recent plays"
        // For now, just leave it empty or hide #lastPlaysContainer if empty.
        // Let's hide the container if there's no history to show.
        const container = document.getElementById('lastPlaysContainer');
        if(container) container.style.display = 'none';
        return;
    }
    
    const container = document.getElementById('lastPlaysContainer');
    if(container) container.style.display = 'flex'; // Ensure it's visible

    recentPlays.reverse().forEach(play => { // Reverse to show oldest of recent first (left-to-right)
        const item = document.createElement('span');
        item.classList.add('last-play-item');
        const multiplier = parseFloat(play.multiplier);
        item.textContent = multiplier.toFixed(multiplier < 10 && multiplier !== Math.floor(multiplier) ? 2 : (multiplier === Math.floor(multiplier) ? 0 : 1) ) + 'x';


        if (multiplier > 1) {
            item.classList.add('last-play-win');
        } else {
            item.classList.add('last-play-loss');
        }
        displayElement.appendChild(item);
    });
}

function animateCounter(element, targetValue, duration, isCurrency = false, isMultiplier = false) {
    const startValue = parseFloat(element.textContent.replace('x', '')) || 0; // Remove 'x' for multiplier parsing
    const increment = (targetValue - startValue) / (duration / 16); // Approx 60fps
    let currentValue = startValue;
    let startTime = null;

    function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = timestamp - startTime;
        // Ensure currentValue does not overshoot due to large increments from fast progress
        currentValue = startValue + increment * (progress / (1000 / 60)); // Using 1000/60 for frame time

        if ((increment > 0 && currentValue >= targetValue) || (increment < 0 && currentValue <= targetValue) || increment === 0) {
            currentValue = targetValue;
        }

        if (isCurrency) {
            element.textContent = currentValue.toFixed(2);
        } else if (isMultiplier) {
            element.textContent = currentValue.toFixed(currentValue < 10 ? 2 : 1) + 'x'; // More precision for smaller multipliers
        } else {
            element.textContent = Math.round(currentValue);
        }

        if (currentValue !== targetValue) {
            requestAnimationFrame(step);
        }
    }
    requestAnimationFrame(step);
}

class Ball {
    constructor(x, y, radius, color) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.vy = 0;
        this.vx = 0;
        this.onPeg = null; // The peg it's currently interacting with
    }

    draw() {
        // Style 2025 Ball - Glowing Orb
        const ballOuterColor = 'rgba(255, 0, 230, 0.1)';  // Transparent magenta for outer glow
        const ballInnerColor = 'rgba(255, 0, 230, 1)';    // Solid magenta for core

        ctx.beginPath();
        const gradient = ctx.createRadialGradient(this.x, this.y, this.radius * 0.2, this.x, this.y, this.radius);
        gradient.addColorStop(0, ballInnerColor);
        gradient.addColorStop(1, ballOuterColor);
        
        ctx.fillStyle = gradient;
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();
    }

    update() {
        // Apply gravity
        this.vy += GRAVITY;
        this.y += this.vy;
        this.x += this.vx;

        // Check if ball has entered the slot area (top edge of slots)
        if (slots.length > 0 && this.y + this.radius >= slots[0].y) { 
            for (let i = 0; i < slots.length; i++) {
                const slot = slots[i];
                // Check if the ball's center X is within the current slot's horizontal boundaries
                if (this.x >= slot.x && this.x <= slot.x + slot.width) {
                    // Ball has landed in this slot
                    this.y = slot.y + slot.height / 2 - this.radius / 2; // Position ball visually in the slot center
                    this.x = slot.x + slot.width / 2;    // Center it horizontally
                    this.vy = 0;
                    this.vx = 0;

                    const winnings = betAmount * slot.multiplier;

                    // Slot highlighting
                    const originalSlotColor = slot.color; // Should be SLOT_COLOR_DEFAULT
                    slot.color = 'var(--accent-gold)'; 
                    drawBoard(); 
                    
                    setTimeout(() => {
                        slot.color = originalSlotColor; 
                        drawBoard(); 
                    }, 1500);

                    // Animate counters
                    animateCounter(multiplierDisplay, slot.multiplier, 800, false, true);
                    animateCounter(winningsDisplay, winnings, 1000, true);

                    // Store play history
                    let history = JSON.parse(localStorage.getItem('plinkoPlayHistory')) || [];
                    history.unshift({ // Add to the beginning of the array
                        bet: betAmount,
                        multiplier: slot.multiplier,
                        winnings: winnings.toFixed(2),
                        risk: riskLevel,
                        rows: numRows,
                        date: new Date().toLocaleString() // More readable date
                    });
                    if (history.length > 20) { // Keep only last 20 plays
                        history = history.slice(0, 20);
                    }
                    localStorage.setItem('plinkoPlayHistory', JSON.stringify(history));
                    updateLastPlaysDisplay(); // Add this call
                    
                    // Optional: Highlight the slot (visual feedback)
                    // This could be done by temporarily changing slot.color and redrawing
                    // e.g., slot.originalColor = slot.color; slot.color = 'gold'; drawBoard();
                    //      setTimeout(() => { slot.color = slot.originalColor; drawBoard(); }, 1000);

                    console.log(`Landed in slot ${i}, Multiplier: ${slot.multiplier}, Winnings: ${winnings}`);
                    if (animationFrameId) {
                        cancelAnimationFrame(animationFrameId);
                        animationFrameId = null; // Clear the ID
                    }
                    dropBallButton.disabled = false;
                    return; // Stop further updates for this ball drop
                }
            }

            // Safety net: If ball is below slots but didn't land in one (e.g., if there were gaps, or extreme edge cases)
            if (this.y + this.radius > slots[0].y + BOTTOM_SLOT_HEIGHT + this.radius) {
                 this.y = slots[0].y + this.radius; // Place it somewhere reasonable
                 this.vy = 0;
                 this.vx = 0;
                 multiplierDisplay.textContent = 'N/A';
                 winningsDisplay.textContent = '0.00';
                 console.log("Ball passed through or missed slots, stopping.");
                 if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                 }
                 dropBallButton.disabled = false;
                 return;
            }
        }

        // Dampen horizontal velocity over time (friction/air resistance)
        this.vx *= 0.99; 
        if (Math.abs(this.vx) < 0.1) this.vx = 0;


        // Collision with pegs
        for (let peg of pegs) {
            const dx = this.x - peg.x;
            const dy = this.y - peg.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < this.radius + PEG_RADIUS) {
                if (this.onPeg !== peg) { 
                    this.onPeg = peg;

                    this.vy = Math.abs(this.vy * DAMPENING * 0.5); 

                    if (Math.abs(dx) < PEG_RADIUS * 0.5 && dy < 0) { 
                        this.vx = (Math.random() - 0.5) * HORIZONTAL_PUSH * 1.5; // Reduced randomness slightly from 2
                    } else {
                        this.vx = (dx > 0 ? 1 : -1) * HORIZONTAL_PUSH * (Math.random() * 0.4 + 0.6); // Ensure push is significant enough
                    }
                    
                    const overlap = (this.radius + PEG_RADIUS) - distance;
                    const pushOutFactor = 0.3; // How much to push out to avoid sticking
                    this.x += (dx / distance) * overlap * pushOutFactor;
                    this.y += (dy / distance) * overlap * pushOutFactor * 0.5; // Less vertical push out

                    break; 
                }
            } else {
                if (this.onPeg === peg) {
                    this.onPeg = null; 
                }
            }
        }
    }
}

function loadSettings() {
    betAmount = parseFloat(localStorage.getItem('plinkoBetAmount')) || 1;
    riskLevel = localStorage.getItem('plinkoRiskLevel') || 'medium';
    numRows = parseInt(localStorage.getItem('plinkoPinRows')) || 12;

    betDisplay.textContent = betAmount.toFixed(2);
    riskDisplay.textContent = riskLevel.charAt(0).toUpperCase() + riskLevel.slice(1);
    rowsDisplay.textContent = numRows;
    multiplierDisplay.textContent = '-';
    winningsDisplay.textContent = '-';
}

function setupCanvas() {
    // Calculate canvas width based on the number of rows
    // The widest part is the bottom row of pegs, which has numRows + 1 pegs, or the slots
    const maxPegsInRow = numRows + 1;
    canvas.width = maxPegsInRow * PEG_SPACING_X + 2 * BOARD_PADDING_X;
    
    // Calculate canvas height
    canvas.height = TOP_OFFSET + (numRows * PEG_SPACING_Y) + BOTTOM_SLOT_HEIGHT + 20; // 20 for bottom padding

    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function generateBoard() {
    pegs = [];
    slots = [];

    // Generate Pegs
    for (let row = 0; row < numRows; row++) {
        const numPegsInRow = row + 1;
        // Calculate the starting X position for this row to center it
        const rowWidth = (numPegsInRow -1) * PEG_SPACING_X;
        let startX = (canvas.width - rowWidth) / 2;

        for (let col = 0; col < numPegsInRow; col++) {
            pegs.push({
                x: startX + col * PEG_SPACING_X,
                y: TOP_OFFSET + row * PEG_SPACING_Y + PEG_RADIUS * 2, // + PEG_RADIUS*2 to start drawing below top_offset
                row: row,
                col: col
            });
        }
    }
    
    // Generate Slots
    const numSlots = numRows + 1;
    const currentMultipliers = MULTIPLIERS[riskLevel]?.[numRows.toString()] || MULTIPLIERS['medium']['12']; // Fallback
    
    const totalSlotWidth = numSlots * SLOT_WIDTH;
    let slotStartX = (canvas.width - totalSlotWidth) / 2;

    for (let i = 0; i < numSlots; i++) {
        slots.push({
            x: slotStartX + i * SLOT_WIDTH,
            y: TOP_OFFSET + (numRows * PEG_SPACING_Y) + PEG_RADIUS * 2,
            width: SLOT_WIDTH,
            height: BOTTOM_SLOT_HEIGHT,
            multiplier: currentMultipliers[i] !== undefined ? currentMultipliers[i] : 0.1, // Fallback multiplier
            // color: SLOT_COLOR_DEFAULT // color property will be used for highlight state
        });
    }
}

function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Pegs - Style 2025
    const pegCoreColor = 'rgba(0, 242, 255, 0.7)'; 
    const pegGlowColor = 'rgba(0, 242, 255, 0.3)'; 
    const pegRadiusOuter = PEG_RADIUS; 
    const pegRadiusInner = PEG_RADIUS * 0.6;

    pegs.forEach(peg => {
        // Outer glow
        ctx.beginPath();
        ctx.arc(peg.x, peg.y, pegRadiusOuter, 0, Math.PI * 2);
        ctx.fillStyle = pegGlowColor;
        ctx.fill();

        // Inner core
        ctx.beginPath();
        ctx.arc(peg.x, peg.y, pegRadiusInner, 0, Math.PI * 2);
        ctx.fillStyle = pegCoreColor;
        ctx.fill();
    });

    // Draw Slots - Style 2025
    const slotFont = 'bold 13px "Inter", sans-serif';
    const slotTextColorDefault = '#e0e5f0'; // var(--primary-text)
    const slotTextColorHighlight = '#FFFFFF';
    const slotDefaultBg = 'rgba(0, 242, 255, 0.1)'; 
    const slotDefaultBorder = 'rgba(0, 242, 255, 0.5)';
    const slotHighlightBg = 'rgba(255, 215, 0, 0.3)'; // Gold background
    const slotHighlightBorder = 'rgba(255, 215, 0, 0.8)'; // Brighter Gold border

    ctx.font = slotFont;
    ctx.textAlign = 'center';
    ctx.lineWidth = 2;

    slots.forEach(slot => {
        ctx.beginPath();
        // Use roundRect if available, otherwise fallback to rect
        if (ctx.roundRect) {
            ctx.roundRect(slot.x, slot.y, slot.width, slot.height, [6]);
        } else {
            ctx.rect(slot.x, slot.y, slot.width, slot.height);
        }

        if (slot.color === 'var(--accent-gold)') { // Check if it's the highlight color string
            ctx.fillStyle = slotHighlightBg;
            ctx.strokeStyle = slotHighlightBorder;
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = slotTextColorHighlight;
        } else {
            ctx.fillStyle = slotDefaultBg;
            ctx.strokeStyle = slotDefaultBorder;
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = slotTextColorDefault;
        }
        
        ctx.fillText(slot.multiplier + 'x', slot.x + slot.width / 2, slot.y + slot.height / 2 + 5); // +5 to vertically center roughly
    });
}

// --- Initialization ---
function initializeGame() {
    loadSettings();
    updateLastPlaysDisplay(); // Add this call
    setupCanvas();
    generateBoard();
    // Create the ball, position it at the top entry point
    // The entry point should be horizontally centered with the first peg of the first row
    let firstPegX;
    const firstRowPegs = pegs.filter(p => p.row === 0);
    if (firstRowPegs.length > 0) {
        // For a typical Plinko board, the ball drops directly above the first (0th index) peg.
        firstPegX = firstRowPegs[0].x;
    } else { 
        firstPegX = canvas.width / 2; // Fallback if no pegs (should not happen)
    }
    // BALL_COLOR argument removed as Ball.draw() now defines its own colors for Style 2025
    ball = new Ball(firstPegX, TOP_OFFSET - BALL_RADIUS * 3, BALL_RADIUS); 
    
    drawBoard(); // Initial static drawing of board
    ball.draw(); // Draw ball in its initial position
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBoard(); 
    
    if (ball) {
        ball.update(); // This will now handle stopping animation and re-enabling button
        ball.draw();
    }

    // Continue animation if not stopped by ball.update()
    if (!(ball && ball.vy === 0 && ball.vx === 0 && ball.y + ball.radius >= canvas.height - BOTTOM_SLOT_HEIGHT - ball.radius)) {
        animationFrameId = requestAnimationFrame(animate);
    } else {
        // This else block might not be strictly necessary if ball.update handles all stop conditions
        // and re-enables the button.
        console.log("Animation loop confirming stop.");
    }
}

// --- Event Listeners ---
settingsButton.onclick = function() {
    window.location.href = 'plinko_setup.html';
};

dropBallButton.onclick = function() {
    if (animationFrameId) { 
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null; // Clear the ID
    }

    multiplierDisplay.textContent = '-';
    winningsDisplay.textContent = '-';
    dropBallButton.disabled = true; 

    let firstPegX;
    const firstRowPegs = pegs.filter(p => p.row === 0);
    if (firstRowPegs.length > 0) {
        firstPegX = firstRowPegs[0].x;
    } else { 
        firstPegX = canvas.width / 2;
    }
    ball.x = firstPegX;
    ball.y = TOP_OFFSET - BALL_RADIUS * 3; // Reset to starting Y position
    ball.vy = 0;
    ball.vx = 0;
    ball.onPeg = null;

    animate(); 
};

// --- Start the game ---
initializeGame();

    </script>
</body>
</html>
